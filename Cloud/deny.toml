# Sovereign — dependency policy.
# Per docs/tech-stack.md §4.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    "RUSTSEC-2026-0173",  # proc-macro-error2: unmaintained, transitive via age::i18n-embed-fl; no safe upgrade
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "OpenSSL",
    "NTP",
    "CDLA-Permissive-2.0",     # transitive: wit-bindgen (wasi)
]
confidence-threshold = 0.8

[bans]
skip = [
    "sovereign",
    "sovereign-core",
    "sovereign-storage-sqlite",
    "sovereign-runtime-docker",
    "sovereign-proxy-caddy",
    "sovereign-secrets-age",
    "sovereign-backup",
    "sovereign-doctor",
    "sovereign-update",
]

# Forbidden per docs/tech-stack.md §9.
deny = [
    { name = "openssl" },       # we use rustls
    { name = "openssl-sys" },
    { name = "async-std" },     # discontinued
    { name = "actix-web" },     # fights tokio
    { name = "diesel" },        # sync, macro-heavy
    { name = "sea-orm" },       # ORM tax
    { name = "git2" },          # libgit2 C dep; we use gix
    { name = "kube" },          # K8s is forbidden
    { name = "kube-rs" },
    { name = "tonic" },         # gRPC is forbidden
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
