[build]
# mold is Linux-only; on Windows the default linker (lld-link / link.exe) is used.
target-dir = "target"

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
    "-C", "link-self-contained=yes",
    "-C", "link-arg=-static",
    "-C", "panic=abort",
    "-C", "strip=symbols",
    "-C", "opt-level=z",
    "-C", "lto=fat",
    "-C", "codegen-units=1",
]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
    "-C", "link-self-contained=yes",
    "-C", "link-arg=-static",
    "-C", "panic=abort",
    "-C", "strip=symbols",
    "-C", "opt-level=z",
    "-C", "lto=fat",
    "-C", "codegen-units=1",
]

[target.x86_64-unknown-linux-gnu]
linker = "rust-lld"
rustflags = [
    "-C", "panic=abort",
    "-C", "strip=symbols",
]
