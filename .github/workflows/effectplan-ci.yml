# Generated by EffectPlan/scripts/sync-ci.mjs - do not edit here.
#
# GitHub Actions only reads workflows from this directory, and EffectPlan lives
# one level down, so the project's real definition is
# EffectPlan/.github/workflows/ci.yml and this is a mirror of it with the
# triggers scoped to that subtree and every run command given a working
# directory. Re-run the script after editing the source, or --check fails.
name: effectplan-ci

on:
  pull_request:
    paths:
      - "EffectPlan/**"
      - ".github/workflows/effectplan-ci.yml"
  push:
    branches: [main]
    paths:
      - "EffectPlan/**"
      - ".github/workflows/effectplan-ci.yml"

permissions:
  contents: read

concurrency:
  group: effectplan-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: EffectPlan

jobs:
  rust-format:
    name: Rust formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p effectplan-engine
      - run: cargo clippy -p effectplan-engine --all-targets

  ci-definition:
    name: CI definition is mirrored to the repository root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run ci:check

  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run typecheck

  ts-tests:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm test

  wasm-build:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build:wasm
      - name: The artifact exists and fits its budget
        run: |
          test -f packages/core/dist/effectplan.wasm
          size=$(stat -c%s packages/core/dist/effectplan.wasm)
          test "$size" -le 40000 || { echo "wasm artifact is $size bytes"; exit 1; }
          echo "wasm artifact: $size bytes"

  wasm-abi:
    name: WebAssembly ABI verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run verify:wasm

  wasm-integration:
    name: WebAssembly integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run test:wasm

  package-size:
    name: Package size enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run verify:size

  package-install:
    name: Package installation smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run verify:package

  browser-smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - name: Run the page in headless Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:browser

  # --------------------------------------------------------------------------
  # Phase 3: Critical Path Intelligence. Each job is one claim about the
  # scheduling layer, and each one insists on having run something: a filtered
  # job that matches no test is a failure, not a pass.
  # --------------------------------------------------------------------------

  rust-scheduling:
    name: Rust scheduling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The CPM unit tests, and a guard against matching none
        run: |
          out=$(cargo test -p effectplan-engine schedule_tests 2>&1)
          echo "$out"
          count=$(echo "$out" | grep -c '^test schedule_tests::')
          echo "schedule_tests ran ${count} tests"
          test "${count}" -ge 20

  timing-properties:
    name: Scheduling properties
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run test:timing-properties

  timing-oracle:
    name: Independent CPM oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run test:timing-oracle

  timing-abi:
    name: Scheduling ABI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run verify:wasm
      - run: npm run test:timing-abi

  timing-overflow:
    name: Duration and tick overflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
