      - name: The arena tiles exactly and the memory stays at 18 pages
        run: npm run verify:wasm
      - run: npm run test:timing-memory

  timing-benchmark:
    name: Scheduling benchmark gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run benchmark:native
      - run: npm run benchmark:ts
      - name: Upload the measured report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: artifacts/benchmarks.json

  timing-browser:
    name: Browser scheduling smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
