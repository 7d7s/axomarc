        run: npm run test:browser

  api-compatibility:
    name: Phase 1 and Phase 2 API compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npm run test:api-compatibility

  # --------------------------------------------------------------------------
  # Phase 4: incremental planning.
  # --------------------------------------------------------------------------

  incremental-rust:
    name: Rust scheduling and checkpoint tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: The checkpoint engine
        run: |
          out=$(cargo test -p effectplan-engine checkpoint_tests 2>&1)
          echo "$out"
          echo "$out" | grep -qE 'test result: ok\. [0-9]+ passed'
          echo "$out" | grep -q 'checkpoint_tests::'
      - name: The scheduling engine
        run: |
          out=$(cargo test -p effectplan-engine schedule_tests 2>&1)
          echo "$out"
          echo "$out" | grep -qE 'test result: ok\. [0-9]+ passed'
          echo "$out" | grep -q 'schedule_tests::'

  checkpoint-tests:
    name: Checkpoint restore and boundaries
    runs-on: ubuntu-latest
