# cargo-deny configuration - supply-chain gate for the Keel platform.
#
# Run locally:   just deny
# Run in CI:     .github/workflows/keel-publish.yml (job: deny)
#
# Policy references: DEPENDENCY-POLICY.md (admission, budget) and SECURITY.md.
# Exceptions require a governance note in the justification table AND a
# comment below explaining why the exception is safe.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# RUSTSEC advisories are denied by default. Only explicitly reviewed,
# accepted advisories may be ignored here (with a linked justification).
ignore = [
  # --- governance note: RUSTSEC-2023-0071 (rsa "Marvin Attack" timing sidechannel)
  # There is NO upstream fix. RustSec marks `patched = []` intentionally: rsa
  # 0.9.10 (latest stable) and 0.10.0-rc.18 are both still affected as of
  # 2026-09-12 (RustCrypto/RSA#626, #680, #702 all open). We do not call `rsa`
  # directly -- it arrives only transitively via sqlx-mysql, which needs it for
  # MySQL `caching_sha2_password` / `sha256_password` authentication, so the
  # only ways to drop it are forking sqlx or dropping MySQL support.
  # Accepted risk, per the advisory's own workaround ("local use on a
  # non-compromised computer is fine"): the database connection must be
  # TLS-protected or network-local. Enforce that in deployment (05-DATABASE).
  # Revisit if sqlx drops the dependency or RustSec records a patch.
  { id = "RUSTSEC-2023-0071", reason = "No upstream fix (patched=[]); transitive via sqlx-mysql only; DB connection must be TLS or local" },
]

[licenses]
version = 2
# Aligned with DEPENDENCY-POLICY.md criterion 3 (MIT / Apache-2.0 / BSD).
# - OpenSSL: ring's historical license tag (pulled in via rustls).
# - MPL-2.0: tolerated exception for `webpki-roots` (Mozilla CA bundle,
#   used by the rustls stack). MPL-2.0 is file-level copyleft; the crate is
#   used unmodified as a data dependency, so no source obligations propagate
#   into Keel code. Any further MPL dependency needs governance approval.
# - Apache-2.0 WITH LLVM-exception: the wasmtime family's license tag
#   (Wave 9 B-30, D-62 amendment in DEPENDENCY-POLICY.md). Apache-2.0 with
#   an extra patent/exception grant on the LLVM clause; it is strictly more
#   permissive than plain Apache-2.0 (already allowed), so no copyleft
#   obligation reaches Keel code.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "OpenSSL",
  "MPL-2.0",
  # 0BSD (BSD Zero Clause) and CDLA-Permissive-2.0: both OSI-approved and
  # permissive, arriving only via transitive dependencies. Added in Phase 5 to
  # stop `cargo deny check licenses` rejecting them (4 `rejected` findings).
  "0BSD",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
# `keel-mod-*` and friends are declared in [workspace.dependencies] as path-only
# entries with no version, which cargo-deny reads as `*`. They are internal
# workspace crates rather than published deps, so version-less PATH wildcards
# are allowed here; wildcard versions on registry crates remain denied.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
