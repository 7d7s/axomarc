<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="{{ refresh_secs }}">
<title>Kelson ops</title>
<style>
  :root { color-scheme: dark; --bg:#0b0e14; --card:#141a24; --edge:#232c3b;
          --fg:#dbe4f0; --dim:#7d8aa0; --ok:#3fb96f; --err:#d95757; --accent:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; align-items:baseline; gap:12px; padding:20px 28px 8px; }
  header h1 { font-size:20px; margin:0; letter-spacing:.4px; }
  header .sub { color:var(--dim); font-size:12px; }
  header a { color:var(--accent); font-size:12px; margin-left:auto; }
  main { display:grid; grid-template-columns:repeat(auto-fit,minmax(360px,1fr));
         gap:16px; padding:16px 28px 32px; }
  section { background:var(--card); border:1px solid var(--edge); border-radius:10px;
            padding:16px; min-height:110px; }
  section h2 { font-size:13px; text-transform:uppercase; letter-spacing:1px;
               color:var(--dim); margin:0 0 10px; }
  section h3 { font-size:12px; text-transform:uppercase; letter-spacing:1px;
               color:var(--dim); margin:14px 0 8px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  td, th { text-align:left; padding:3px 6px; border-bottom:1px solid var(--edge);
           vertical-align:top; }
  th { color:var(--dim); font-weight:500; }
  code { font-family:ui-monospace, Consolas, monospace; }
  .note { color:var(--dim); font-style:italic; }
  .stat { display:inline-block; margin:2px 8px 2px 0; padding:2px 10px;
          border-radius:999px; background:#1c2534; border:1px solid var(--edge);
          font-size:12px; }
  .stat b { color:var(--accent); }
  .ok { color:var(--ok); }
  .bad { color:var(--err); }
  .muted { color:var(--dim); font-size:12px; }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Kelson ops</h1>
  <span class="sub">read-only over queue, schedules and traces &mdash; {{ generated_at }}</span>
  <a href="/_dashboard">lite dashboard</a>
</header>
<main>
  @include("dashboard.ops.queue")
  @include("dashboard.ops.jobs")
  @include("dashboard.ops.schedule")
  @include("dashboard.ops.inspect")
</main>
</body>
</html>
