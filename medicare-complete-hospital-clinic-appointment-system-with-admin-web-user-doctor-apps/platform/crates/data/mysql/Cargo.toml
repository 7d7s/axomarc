[package]
name = "keel-mysql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
description = "Keel adapter: MySQL 8 fabric — pool, SQL-first migrations, delta/audit/outbox, idempotency (Wave 9 B-31 second driver)."

[dependencies]
keel-foundation = { workspace = true }
keel-context = { workspace = true }
keel-execution = { workspace = true }
keel-transaction = { workspace = true }
keel-event = { workspace = true }
keel-models = { workspace = true }
keel-query = { workspace = true }
keel-jobs = { workspace = true }
keel-tokens = { workspace = true }
keel-session = { workspace = true }
keel-identity = { workspace = true }
keel-integrity = { workspace = true }
keel-notifications = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lib]
# Wave 9 B-31: lib unit tests and doctests are off; the DB-backed keel-mysql
# matrix rides the keel-postgres `pg-tests` integration files (which skip
# unless DATABASE_URL points at a MySQL 8 instance). The one target this crate
# does own is tests/schema_roundtrip.rs (Phase D): the fluent schema-builder
# gate is pure — no database — so it runs in every workspace gate and keeps
# the shipped migrations builder-reproducible byte for byte (suite +1).
test = false
doctest = false
