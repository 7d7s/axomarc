# Wave 6 P3 (docs/19 i18n): default-locale messages, loaded at boot from
# the `[i18n] paths` roots (default `lang/`). Keys are dotted; nested
# tables and dotted keys flatten identically. Validation entries mirror
# the built-in English wording, so en responses stay equivalent to the
# no-catalog posture ({attribute} renders the display name or, by
# default, the field path itself).

[validation]
required = "{attribute} is required"
present = "{attribute} must be present"
email = "must be a valid email"
string = "must be a string"
integer = "must be an integer"
boolean = "must be a boolean"

# Pluralized vocabulary for `trans_choice` (CLDR buckets; `{count}`
# substitutes the count). Unsupported locales pick the `other` form.
[appointments]
count = "zero=No appointments | one=One appointment | other={count} appointments"

# Notification-string vocabulary resolved through the notify hub
# (`NotifyHub::with_catalog`); producers carry the request locale and
# vars interpolate as `{patient}`-style placeholders.
[notifications]
appointment_booked = "Appointment booked for {patient}"
