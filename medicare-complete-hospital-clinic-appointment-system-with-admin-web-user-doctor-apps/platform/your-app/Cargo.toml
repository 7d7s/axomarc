[workspace]
resolver = "2"
members = [
  "modules/*",
  "apps/*",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/7d7s/axomarc"
keywords = ["kelson", "app"]

[workspace.dependencies]
# Framework umbrella (re-exports the published framework surface).
# Local path sources for dev; switch to registry sources for release.
kelson-framework = { version = "0.1", path = "../keel-platform/crates/framework" }

# Framework crates (direct deps for modules that need them)
kelson-jobs = { version = "0.1", path = "../keel-platform/crates/async/jobs" }
kelson-event = { version = "0.1", path = "../keel-platform/crates/async/events" }
kelson-wasm = { version = "0.1", path = "../keel-platform/crates/extension/wasm" }
kelson-caching = { version = "0.1", path = "../keel-platform/crates/services/cache" }
kelson-scheduling = { version = "0.1", path = "../keel-platform/crates/async/scheduler" }
kelson-storage = { version = "0.1", path = "../keel-platform/crates/services/storage" }
kelson-search = { version = "0.1", path = "../keel-platform/crates/services/search" }
kelson-realtime = { version = "0.1", path = "../keel-platform/crates/services/realtime" }
kelson-deployment = { version = "0.1", path = "../keel-platform/crates/enterprise/deployment" }
# Both fabrics are declared: the driver itself is chosen at runtime by
# the host (`match cfg.database()` -> DbPool::Postgres | DbPool::MySql),
# so an application module may reach for either store directly instead of
# inheriting a Postgres-only assumption from this list.
kelson-postgres = { version = "0.1", path = "../keel-platform/crates/data/postgres" }
kelson-mysql = { version = "0.1", path = "../keel-platform/crates/data/mysql" }
kelson-feature-flags = { version = "0.1", path = "../keel-platform/crates/enterprise/feature-flags" }
kelson-session = { version = "0.1", path = "../keel-platform/crates/security/sessions" }
kelson-identity = { version = "0.1", path = "../keel-platform/crates/security/identity" }
kelson-policy = { version = "0.1", path = "../keel-platform/crates/security/policies" }
kelson-integrity = { version = "0.1", path = "../keel-platform/crates/security/integrity" }
kelson-observability = { version = "0.1", path = "../keel-platform/crates/observability/logging" }
kelson-telemetry = { version = "0.1", path = "../keel-platform/crates/observability/telemetry" }
kelson-tenancy = { version = "0.1", path = "../keel-platform/crates/enterprise/tenancy" }
kelson-execution = { version = "0.1", path = "../keel-platform/crates/execution/engine" }
kelson-config = { version = "0.1", path = "../keel-platform/crates/application/configuration" }
kelson-registry = { version = "0.1", path = "../keel-platform/crates/application/registry" }
kelson-http = { version = "0.1", path = "../keel-platform/crates/web/http" }

# External
axum = { version = "=0.8.6", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "uuid", "time", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio-stream = { version = "0.1", features = ["sync"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
redis = { version = "0.27", default-features = false, features = ["script"] }
wasmtime = { version = "36", default-features = false, features = ["cranelift", "runtime", "wat", "std"] }

[profile.dev]
debug = 1