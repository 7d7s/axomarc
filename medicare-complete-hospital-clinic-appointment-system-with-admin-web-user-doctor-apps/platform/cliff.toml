# git-cliff configuration for the Keel platform changelog.
#
# Regenerate:  just changelog keel/platform-v0.1.0
# The CI release tag job invokes it with --include-path scoped to the
# platform directory (computed from the git repo root at run time).

[changelog]
header = """
# Changelog

All notable changes to the Keel platform are documented here.
Generated by [git-cliff](https://git-cliff.org) from Conventional Commits.

"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="keel/platform-v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""
postprocessors = []

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^docs", group = "Documentation" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "Miscellaneous" },
]
protect_breaking_features = false
tag_pattern = "keel/platform-v[0-9].*"
topo_order = false
use_branch_sorting = false
sort_commits = "oldest"
