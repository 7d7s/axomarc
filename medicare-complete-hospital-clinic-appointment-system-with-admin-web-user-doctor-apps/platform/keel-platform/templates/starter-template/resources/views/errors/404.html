<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ status }} {{ title }} - __PROJECT_NAME__</title>
  <style>
    /* System colors follow the OS light/dark scheme without any at-rule
       (the views parser treats parenthesized @-directives as custom). */
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
      font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 34rem; padding: 2.5rem 2rem; text-align: center; }
    .code { margin: 0; font-size: 4rem; font-weight: 700; letter-spacing: 0.04em; }
    h1 { margin: 0.25rem 0 0; font-size: 1.25rem; }
    p { margin: 0.75rem 0 0; }
    .path {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.875rem;
      opacity: 0.7;
      word-break: break-all;
    }
    a { display: inline-block; margin-top: 1.5rem; color: inherit; }
  </style>
</head>
<body>
  <main>
    <p class="code">{{ status }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <p class="path">{{ path }}</p>
    <a href="/">&#8592; Back to __PROJECT_NAME__</a>
  </main>
</body>
</html>
