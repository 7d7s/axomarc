[package]
name = "kelson-demo"
description = "Kelson API host: boots the ApplicationHost, serves health/readiness and the first routes"
# Demo/dev API host (renamed to kelson-demo): hard-wires kelson-mod-appointments and the Sentinel# metrics layer, neither of which ships to crates.io (Wave 2 publish-dry triage).
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[[bin]]
name = "kelson-demo"
path = "src/main.rs"

[features]
demo = ["kelson-mod-appointments", "kelson-mod-oauth2"]
# ADR 0019 §4 opt-in, forwarded so the component fixture cases in the existing
# `wasm_tests` suite can be compiled and run explicitly (`--features
# component-model`). Off by default: no mandated gate passes `--all-features`.
component-model = ["kelson-wasm/component-model"]

[dependencies]
kelson-foundation = { workspace = true }
kelson-context = { workspace = true }
kelson-execution = { workspace = true }
kelson-lifecycle = { workspace = true }
kelson-registry = { workspace = true }
kelson-command = { workspace = true }
kelson-query = { workspace = true }
kelson-http = { workspace = true }
kelson-validation = { workspace = true }
kelson-config = { workspace = true }
kelson-caching = { workspace = true }
kelson-cache-memory = { workspace = true }
kelson-cache-redis = { workspace = true }
kelson-metrics = { workspace = true }
kelson-policy = { workspace = true }
kelson-scope = { workspace = true }
kelson-models = { workspace = true }
kelson-jobs = { workspace = true }
kelson-scheduling = { workspace = true }
kelson-postgres = { workspace = true }
kelson-mysql = { workspace = true }
kelson-observability = { workspace = true }
kelson-notifications = { workspace = true }
kelson-feature-flags = { workspace = true }
kelson-session = { workspace = true }
kelson-realtime = { workspace = true }
kelson-tokens = { workspace = true }
kelson-tenancy = { workspace = true }
kelson-identity = { workspace = true }
kelson-storage = { workspace = true }
kelson-storage-local = { workspace = true }
kelson-storage-s3 = { workspace = true }
kelson-views = { workspace = true }
kelson-mod-appointments = { workspace = true, optional = true }
kelson-mod-oauth2 = { workspace = true, optional = true }
# Wave 9 B-30: the WASM plugin runtime (internal-only, publish = false — the
# publish set stays 61; only this runtime hosts plugins, never the console).
kelson-wasm = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
kelson-policy = { workspace = true }
kelson-foundation = { workspace = true }
# ADR 0019: the component fixture cases drive `wasmtime::component` directly
# over the existing `wasm_tests` suite. `wasmtime` is already an external in
# `[workspace.dependencies]` (DEPENDENCY-POLICY row 46), so this adds no new
# external and the analyzer cap is unchanged.
wasmtime = { workspace = true }