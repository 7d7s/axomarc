[package]
name = "kelson-tenancy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
description = "Kelson enterprise control plane: tenancy service (resolution, plan/status enforcement, TENANT lifetime scope)."

[dependencies]
kelson-foundation = { workspace = true }
kelson-context = { workspace = true }
# §3.2 extension traits: Enterprise may depend on Services (cache/storage)
# and Async (jobs/events/scheduler) per the allowed_deps matrix.
# `tenant-ports` is requested explicitly, NOT inherited from a default: the
# scoped extensions below ARE the tenant-scoped ports, so building this crate
# without them is meaningless. Reliance on a `default = [...]` elsewhere would
# make a `--no-default-features` rebuild silently drop §3.2.
kelson-caching = { workspace = true, features = ["tenant-ports"] }
kelson-storage = { workspace = true, features = ["tenant-ports"] }
kelson-jobs = { workspace = true }
kelson-event = { workspace = true }
kelson-scheduling = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

[package.metadata.docs.rs]
all-features = true
