# Keel public API registry (blueprint item 49, L70/L72, G14).
#
# Every public framework API owns a stable API-ID. `keel upgrade` reports
# deprecated entries with their replacements; CI diffs this file to detect
# breaking changes (cargo-semver-checks enforces the Rust surface, this file
# carries the governance metadata around it).
#
# stability: stable | beta | experimental | deprecated

[[api]]
id = "EXEC-API-0001"
api = "keel_execution::Engine::execute"
stability = "stable"
introduced = "0.1"

