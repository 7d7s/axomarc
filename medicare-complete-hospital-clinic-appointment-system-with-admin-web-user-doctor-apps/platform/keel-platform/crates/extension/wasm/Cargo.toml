[package]
name = "kelson-wasm"
# Wave 9 B-30 (docs/19): internal-only — never published to crates.io, so
# the publish set stays at 61. kelson-console (Tools) does not link this crate;
# only the runtime (kelson-demo) hosts plugins.
publish = false
description = "WASM plugin runtime: fuel-metered wasmtime sandbox, kelson_manifest()/kelson_call() guest ABI, fail-closed import surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[dependencies]
kelson-foundation = { workspace = true }
kelson-context = { workspace = true }
kelson-execution = { workspace = true }
kelson-models = { workspace = true }
kelson-module-contract = { workspace = true }
kelson-registry = { workspace = true }
kelson-tokens = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
wasmtime = { workspace = true }

[features]
# ADR 0019 §4: the Component Model is an opt-in cargo feature, off by default,
# so the workspace dependency at platform/keel-platform/Cargo.toml:202 keeps its
# `default-features = false, features = ["cranelift", "runtime", "wat", "std"]`
# and nothing changes for a default build. A feature on an existing dependency
# adds no `[workspace.dependencies]` entry, so the external cap stays 25/25.
default = []
component-model = ["wasmtime/component-model"]

[lib]
# Wave 9 B-30: every kelson-wasm test lives in an EXISTING suite (the kelson-demo
# `wasm_tests` facet module plus registry suites drive this runtime over the
# real edge), so the crate opts out of its own lib test target and doctests —
# the suite count stays 150 (oauth2 precedent).
test = false
doctest = false
