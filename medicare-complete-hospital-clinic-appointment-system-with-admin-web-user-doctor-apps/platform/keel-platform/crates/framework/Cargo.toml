[package]
name = "keel-framework"
description = "Keel framework umbrella: the one dependency an application needs - re-exports the published framework surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["keel", "framework", "umbrella"]
categories = ["web-programming"]

# The umbrella is a re-export surface only: no logic, no new dependencies.
# D-62 (external dependency budget, 25/25) is untouched by this crate.
[dependencies]
keel-foundation = { workspace = true }
keel-context = { workspace = true }
keel-lifecycle = { workspace = true }
keel-config = { workspace = true }
keel-execution = { workspace = true }
keel-registry = { workspace = true }
keel-http = { workspace = true }
keel-jobs = { workspace = true }
keel-event = { workspace = true }
keel-caching = { workspace = true }
keel-scheduling = { workspace = true }
keel-storage = { workspace = true }
keel-search = { workspace = true }
keel-realtime = { workspace = true }
keel-session = { workspace = true }
keel-identity = { workspace = true }
keel-policy = { workspace = true }
keel-integrity = { workspace = true }
keel-postgres = { workspace = true }
keel-mysql = { workspace = true }
keel-feature-flags = { workspace = true }
keel-tenancy = { workspace = true }
keel-deployment = { workspace = true }
keel-observability = { workspace = true }
keel-telemetry = { workspace = true }
keel-wasm = { workspace = true }
