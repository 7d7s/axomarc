[package]
name = "kelson-framework"
description = "Kelson framework umbrella: the one dependency an application needs - re-exports the published framework surface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kelson", "framework", "umbrella"]
