[dev-dependencies]
# Wave 9 B-31: the live-MySQL driver matrix rides the same feature-gated
# integration files (existing suites, same DATABASE_URL gate). Both fabrics
# are publishable, so the publish guard stays satisfied.
kelson-mysql = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[features]
# Enables the live-Postgres + live-MySQL integration matrices (B-19 / B-31).
# Each test skips when DATABASE_URL does not point at its own driver.
pg-tests = []
