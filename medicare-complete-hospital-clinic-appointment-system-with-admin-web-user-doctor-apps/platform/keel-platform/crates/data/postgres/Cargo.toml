[package]
name = "keel-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
description = "Keel adapter: PostgreSQL fabric — pool, tx engine, RLS, delta/audit/outbox, idempotency."

[dependencies]
keel-foundation = { workspace = true }
keel-context = { workspace = true }
keel-execution = { workspace = true }
keel-transaction = { workspace = true }
keel-event = { workspace = true }
keel-models = { workspace = true }
keel-query = { workspace = true }
keel-jobs = { workspace = true }
keel-tokens = { workspace = true }
keel-session = { workspace = true }
keel-identity = { workspace = true }
keel-integrity = { workspace = true }
keel-notifications = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# Wave 9 B-31: the live-MySQL driver matrix rides the same feature-gated
# integration files (existing suites, same DATABASE_URL gate). Both fabrics
# are publishable, so the publish guard stays satisfied.
keel-mysql = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[features]
# Enables the live-Postgres + live-MySQL integration matrices (B-19 / B-31).
# Each test skips when DATABASE_URL does not point at its own driver.
pg-tests = []
