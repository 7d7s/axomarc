[package]
name = "kelson-mysql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
description = "Kelson adapter: MySQL 8 fabric — pool, SQL-first migrations, delta/audit/outbox, idempotency (Wave 9 B-31 second driver)."

[dependencies]
kelson-foundation = { workspace = true }
kelson-context = { workspace = true }
kelson-execution = { workspace = true }
kelson-transaction = { workspace = true }
kelson-event = { workspace = true }
kelson-models = { workspace = true }
kelson-query = { workspace = true }
kelson-jobs = { workspace = true }
kelson-tokens = { workspace = true }
kelson-session = { workspace = true }
kelson-identity = { workspace = true }
kelson-integrity = { workspace = true }
kelson-notifications = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1.68"
chrono = { version = "0.4", features = ["serde"] }

[package.metadata.docs.rs]
all-features = true

[lib]
# Wave 9 B-31: the DB-backed kelson-mysql matrix rides the kelson-postgres
# `pg-tests` integration files (which skip unless DATABASE_URL points at a
# MySQL 8 instance). The one target this crate does own is
# tests/schema_roundtrip.rs (Phase D): the fluent schema-builder gate is
# pure — no database — so it runs in every workspace gate and keeps the
# shipped migrations builder-reproducible byte for byte (suite +1).
#
# The lib's own unit tests are ON: they are pure (the statement splitter,
# the auto-commit verdict, the online-change rules, the cost budget) and
# need no database. They used to be off with the whole lib; turning them on
# costs a second and proves the rules the live matrices rely on.
doctest = false
