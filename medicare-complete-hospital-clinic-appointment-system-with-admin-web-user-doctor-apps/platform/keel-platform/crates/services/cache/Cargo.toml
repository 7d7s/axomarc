[package]
name = "kelson-caching"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
description = "Kelson framework: named cache ports (identity/authorization/config/reference/query/edge)."

[dependencies]
kelson-foundation = { workspace = true }
serde_json = { workspace = true }

[features]
# §3.1 tenant-scoped port (`TenantCachePort` + the `TenantCacheShard`
# namespacing adapter). ON by default: §3.2's `TenantScopedCache` extension in
# kelson-tenancy cannot exist without it, so `kelson-tenancy` also requests this
# feature explicitly rather than relying on the default. `--no-default-features`
# compiles a physical-port-only build (`CachePort` alone) for deployments with
# no tenants at all.
default = ["tenant-ports"]
tenant-ports = []

[package.metadata.docs.rs]
all-features = true
