[package]
name = "kelson-mod-oauth2"
# Internal-only crate: not published to crates.io.
publish = false
description = "OAuth2 authorization server: authorize, token, revoke, client registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[dependencies]
# The host half of this module. The guest is the only consumer.
kelson-oauth2-contract = { workspace = true }
# ADR 0020: the seam. `guest_entry!` declares the ABI exports and hands the
# host-backed `HostModelStore`/`HostTokenStore`, which is how the handlers
# reach rows and tokens without the kernel ever linking this crate.
kelson-module-sdk = { workspace = true }
kelson-foundation = { workspace = true }
kelson-context = { workspace = true }
kelson-execution = { workspace = true }
kelson-lifecycle = { workspace = true }
kelson-models = { workspace = true }
kelson-tokens = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

[lib]
# Wave 8 P5 (B-21): every oauth2 test lives in an EXISTING suite (the
# kelson-demo http_integration suite drives the whole code flow over the real
# edge), so this crate opts out of its own test target — `cargo test
# --workspace` keeps its suite count unchanged.
test = false
doctest = false
# A module ships as an artifact the host loads, not as a library other crates
# link. The host-target build is what `cargo clippy --workspace` lints; the
# artifact itself comes from:
#
#   cargo build --release --target wasm32-wasip1 -p kelson-mod-oauth2
crate-type = ["cdylib"]

[package.metadata.docs.rs]
all-features = true
