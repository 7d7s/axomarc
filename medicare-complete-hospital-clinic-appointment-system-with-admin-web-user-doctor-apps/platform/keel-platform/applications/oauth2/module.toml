# module.toml — immutable contract shape (11-SPEC SS7). `kelson graph` compiles it.
# Host-side review state (`abi`'s precedent): this module's handlers take no
# `ctx` parameter, so the executing context travels inside each payload. It
# is cleared before the guest/sidecar drift comparison - a guest cannot
# declare whether its own handlers take one.
envelope_context = true

[module]
name = "oauth2"
api = 1
version = "0.1.0"
maturity = "L0"
plane = "tenant"
description = "OAuth2 authorization server: authorize, token, revoke, client registry"

[capabilities]
# B-21 (Wave 8): four capabilities, never core. `inputs` declares each
# operation's input shape (the GRAPH-VALIDATION-FIELD gate stays skipped —
# this module ships no [[validation]]; protocol checks live in the handlers,
# where RFC error semantics belong).
authorize = { profile = "COMMAND", inputs = ["client_id", "redirect_uri", "response_type", "state", "scope", "code_challenge", "code_challenge_method"] }
token = { profile = "COMMAND", inputs = ["grant_type", "code", "code_verifier", "refresh_token", "client_id", "client_secret", "redirect_uri"] }
revoke = { profile = "COMMAND", inputs = ["token", "token_type_hint", "client_id", "client_secret"] }
"clients.manage" = { profile = "COMMAND", inputs = ["action", "id", "name", "redirect_uris", "scopes"] }

[dependencies]
contracts = []

# The authorization endpoint is the browser-facing half of the code flow:
# web plane (session identity + the Wave 7 CSRF double-submit on POST),
# 302 back to a registered redirect_uri carrying the code. Both verbs run
# ONE operation — GET answers a query-string request, POST a form submit.
[[routes]]
method = "GET"
path = "/oauth/authorize"
operation = "authorize"
capability = "authorize"
name = "authorize"
plane = "web"
response = "redirect"

[[routes]]
method = "POST"
path = "/oauth/authorize"
operation = "authorize"
capability = "authorize"
name = "authorize_post"
plane = "web"
response = "redirect"

# Token and revoke answer machine clients: public = true strips the edge's
# session stages (the HANDLER authenticates the client per RFC 6749 sec 2.3
# / RFC 7009 — client_id + secret in the body), api plane, JSON envelope.
[[routes]]
method = "POST"
path = "/oauth/token"
operation = "token"
capability = "token"
name = "token"
public = true

[[routes]]
method = "POST"
path = "/oauth/revoke"
operation = "revoke"
capability = "revoke"
name = "revoke"
public = true
