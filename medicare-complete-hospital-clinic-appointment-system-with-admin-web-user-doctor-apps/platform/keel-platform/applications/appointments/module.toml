# module.toml — immutable contract shape (11-SPEC SS7). `kelson graph` compiles it.
# Host-side review state (`abi`'s precedent): this module's handlers take no
# `ctx` parameter, so the executing context travels inside each payload. It
# is cleared before the guest/sidecar drift comparison - a guest cannot
# declare whether its own handlers take one.
envelope_context = true

[module]
name = "appointments"
api = 1
version = "0.1.0"
maturity = "L0"
plane = "tenant"
description = "Clinic appointments: book, cancel, list"

[capabilities]
# Wave 4 Phase 4: `inputs` declares each operation's input shape — the
# GRAPH-VALIDATION-FIELD gate refuses [[validation]] fields outside it
# (absent/empty inputs = shape undeclared → gate skipped; the `_`-prefixed
# injection namespace is never checked).
book = { profile = "COMMAND", inputs = ["patient", "slot", "photo"] }
cancel = { profile = "COMMAND", inputs = ["password"] }
list = { profile = "READ", inputs = ["page"] }
availability = { profile = "READ", inputs = ["date"] }

[dependencies]
contracts = []

[[routes]]
method = "POST"
path = "/api/v1/appointments"
operation = "book"
capability = "book"
name = "book"

[[routes]]
method = "DELETE"
path = "/api/v1/appointments/{id}"
operation = "cancel"
capability = "cancel"
name = "cancel"
# Wave 1 model binding reference: the edge resolves {id} through the
# route.bindings registry (tenant-scoped) and injects _bindings.id.
# Misses and cross-tenant lookups are 404 envelopes.
bindings = [{ param = "id", model = "Appointment" }]

[[routes]]
method = "GET"
path = "/api/v1/appointments"
operation = "list"
capability = "list"
name = "list"

# Wave 1 reference: public = true strips the implicit auth/verified stages
# (throttle stays). The handler plan opts out of authorization so anonymous
# callers reach it; non-public routes stay fail-closed.
[[routes]]
method = "GET"
path = "/api/v1/appointments/availability"
operation = "availability"
capability = "availability"
name = "availability"
public = true

# Wave 1 reference: deprecated = true emits the Deprecation: true response
# header + envelope meta (L72). Kept as an alias of list.
[[routes]]
method = "GET"
path = "/api/v1/appointments/history"
operation = "list"
capability = "list"
name = "history"
deprecated = true

[[events]]
name = "appointment.booked"

[[events]]
name = "appointment.cancelled"

# Wave 1 FormRequest wiring: manifest validation enforced at the HTTP edge
# before CommandBus dispatch (422 envelope with fields meta). Rule grammar:
# kelson_validation::Rule::from_token (GRAPH-VALIDATION-RULE gate).
[[validation]]
operation = "book"
field = "patient"
rules = ["required", "max:120"]

# Wave 4 Phase 4: `unique:Appointment` probes the model.probes row probe for
# another live appointment at the same slot (no double-booking). Cancel flips
# status without soft-deleting, so a cancelled appointment keeps its slot;
# only `deleted_at` rows (prune) release it. A missing probe or store failure
# fails closed as a 503, never a pass.
[[validation]]
operation = "book"
field = "slot"
rules = ["required", "date", "before:2030-01-01", "unique:Appointment"]

# Wave 4 Phase 3: optional attachment — the multipart intake stores the part
# and the file rules read its metadata (absent JSON key + absent part skips,
# so plain JSON bookings are untouched).
[[validation]]
operation = "book"
field = "photo"
rules = ["image", "mimes:jpg,png", "extensions:jpg,png", "dimensions:min_w=100"]

# Wave 4 Phase 3: sensitive-action re-auth — `current_password` verifies
# against the caller's stored credential via the edge's verifier (absent
# field skips; a wrong password fails closed).
[[validation]]
operation = "cancel"
field = "password"
rules = ["current_password"]
