[package]
name = "kelson-mod-appointments"
# Internal-only crate: not published to crates.io.
publish = false
description = "Clinic appointments: book, cancel, list"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[dependencies]
# The host half of this module. The guest is the only consumer.
kelson-appointments-contract = { workspace = true }
# ADR 0020: the seam. `guest_entry!` declares the ABI exports and hands the
# host-backed `HostModelStore`, which is how the handlers reach rows without
# the kernel ever linking this crate.
kelson-module-sdk = { workspace = true }
kelson-foundation = { workspace = true }
kelson-context = { workspace = true }
kelson-execution = { workspace = true }
kelson-lifecycle = { workspace = true }
kelson-models = { workspace = true }
kelson-notifications = { workspace = true }
kelson-query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[lib]
# A module ships as an artifact the host loads, not as a library other crates
# link. The host-target build is what `cargo clippy --workspace` lints (and
# what runs this crate's own suite); the artifact itself comes from:
#
#   cargo build --release --target wasm32-wasip1 -p kelson-mod-appointments
crate-type = ["cdylib"]

[dev-dependencies]
kelson-identity = { workspace = true }
kelson-policy = { workspace = true }
kelson-registry = { workspace = true }
tokio = { workspace = true }
time = { workspace = true }

[package.metadata.docs.rs]
all-features = true
