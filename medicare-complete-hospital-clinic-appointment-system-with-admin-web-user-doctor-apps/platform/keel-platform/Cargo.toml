[workspace]
resolver = "2"
members = [
  "crates/foundation/core",
  "crates/foundation/context",
  "crates/foundation/contracts",
  "crates/foundation/lifecycle",
  "crates/foundation/validation",
  "crates/execution/engine",
  "crates/execution/command",
  "crates/execution/query",
  "crates/execution/transaction",
  "crates/application/registry",
  "crates/application/configuration",
  "crates/web/http",
  "crates/web/views",
  "crates/security/identity",
  "crates/security/scopes",
  "crates/security/ownership",
  "crates/security/policies",
  "crates/security/elevation",
  "crates/security/tokens",
  "crates/security/sessions",
  "crates/security/integrity",
  "crates/data/postgres",
  "crates/data/mysql",
  "crates/data/models",
  "crates/data/appointments",
  "crates/data/oauth2",
  "crates/async/events",
  "crates/async/jobs",
  "crates/async/workflows",
  "crates/async/scheduler",
  "crates/services/cache",
  "crates/services/storage",
  "crates/services/notifications",
  "crates/services/http-client",
  "crates/services/realtime",
  "crates/services/search",
  "crates/services/kelson-process",
  "crates/ai/client",
  "crates/ai/tools",
  "crates/ai/agents",
  "crates/ai/mcp",
  "crates/observability/logging",
  "crates/observability/telemetry",
  "crates/observability/tracing",
  "crates/observability/metrics",
  "crates/observability/audit",
  "crates/observability/pipeline",
  "crates/observability/buffer",
  "crates/observability/export",
  "crates/enterprise/tenancy",
  "crates/enterprise/feature-flags",
  "crates/enterprise/deployment",
  "crates/extension/wasm",
  "crates/module/contract",
  "crates/module/sdk",
  "adapters/kelson-cache-memory",
  "adapters/kelson-cache-redis",
  "adapters/kelson-ratelimit-redis",
  "adapters/kelson-session-redis",
  "adapters/kelson-session-postgres",
  "adapters/kelson-sms-msg91",
  "adapters/kelson-mail-smtp",
  "adapters/kelson-storage-s3",
  "adapters/kelson-storage-local",
  "adapters/kelson-push-fcm",
  "adapters/kelson-webhooks",
  "adapters/kelson-search-pgvector",
  # Host binaries + the reference application modules (merged from keel-kernel)
  "runtime/kelson-demo",
  "runtime/kelson-worker",
  "applications/appointments",
  "applications/oauth2",
      # Umbrella crate: the one dependency an application takes
  "crates/framework",
  "tools/kelson-console",
  "tools/kelson-analyzer",
  "tools/kelson-codegen",
  # Template files compiled into the console (see templates/README.md)
  "templates",
  "xtask",
  "tests/architecture",
  "testing/testkit",
  "testing/module-marker",
  "examples/minimal", "examples/reference",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/7d7s/axomarc"
readme = "README.md"
keywords = ["kelson", "framework"]

[workspace.dependencies]
# --- internal (FOUNDATION) ---
kelson-foundation = { version = "0.1.0", path = "crates/foundation/core" }
kelson-context = { version = "0.1.0", path = "crates/foundation/context" }
kelson-contracts = { version = "0.1.0", path = "crates/foundation/contracts" }
kelson-lifecycle = { version = "0.1.0", path = "crates/foundation/lifecycle" }
kelson-validation = { version = "0.1.0", path = "crates/foundation/validation" }
# --- internal (EXECUTION) ---
kelson-execution = { version = "0.1.0", path = "crates/execution/engine" }
kelson-command = { version = "0.1.0", path = "crates/execution/command" }
kelson-query = { version = "0.1.0", path = "crates/execution/query" }
kelson-transaction = { version = "0.1.0", path = "crates/execution/transaction" }
# --- internal (APPLICATION) ---
kelson-registry = { version = "0.1.0", path = "crates/application/registry" }
kelson-config = { version = "0.1.0", path = "crates/application/configuration" }
# --- internal (WEB) ---
kelson-http = { version = "0.1.0", path = "crates/web/http" }
kelson-views = { version = "0.1.0", path = "crates/web/views" }
# --- internal (SECURITY) ---
kelson-identity = { version = "0.1.0", path = "crates/security/identity" }
kelson-scope = { version = "0.1.0", path = "crates/security/scopes" }
kelson-ownership = { version = "0.1.0", path = "crates/security/ownership" }
kelson-policy = { version = "0.1.0", path = "crates/security/policies" }
kelson-elevation = { version = "0.1.0", path = "crates/security/elevation" }
kelson-tokens = { version = "0.1.0", path = "crates/security/tokens" }
kelson-session = { version = "0.1.0", path = "crates/security/sessions" }
kelson-integrity = { version = "0.1.0", path = "crates/security/integrity" }
# --- internal (DATA) ---
kelson-postgres = { version = "0.1.0", path = "crates/data/postgres" }
kelson-mysql = { version = "0.1.0", path = "crates/data/mysql" }
kelson-models = { version = "0.1.0", path = "crates/data/models" }
# --- internal (ASYNC) ---
kelson-event = { version = "0.1.0", path = "crates/async/events" }
kelson-jobs = { version = "0.1.0", path = "crates/async/jobs" }
kelson-workflow = { version = "0.1.0", path = "crates/async/workflows" }
kelson-scheduling = { version = "0.1.0", path = "crates/async/scheduler" }
# --- internal (SERVICES) ---
kelson-caching = { version = "0.1.0", path = "crates/services/cache" }
kelson-storage = { version = "0.1.0", path = "crates/services/storage" }
kelson-notifications = { version = "0.1.0", path = "crates/services/notifications" }
kelson-http-client = { version = "0.1.0", path = "crates/services/http-client" }
kelson-search = { version = "0.1.0", path = "crates/services/search" }
kelson-process = { version = "0.1.0", path = "crates/services/kelson-process" }
kelson-ai = { version = "0.1.0", path = "crates/ai/client" }
kelson-ai-tools = { version = "0.1.0", path = "crates/ai/tools" }
kelson-ai-agents = { version = "0.1.0", path = "crates/ai/agents" }
kelson-ai-mcp = { version = "0.1.0", path = "crates/ai/mcp" }
kelson-realtime = { version = "0.1.0", path = "crates/services/realtime" }
# --- internal (ENTERPRISE) ---
kelson-tenancy = { version = "0.1.0", path = "crates/enterprise/tenancy" }
kelson-feature-flags = { version = "0.1.0", path = "crates/enterprise/feature-flags" }
kelson-deployment = { version = "0.1.0", path = "crates/enterprise/deployment" }
# --- internal (EXTENSION) ---
kelson-wasm = { path = "crates/extension/wasm" }
# --- internal (MODULE) ---
# The WASM application-module layer: the seam's data contract (shared by the
# host and every guest) and the guest-side SDK (used by modules only).
kelson-module-contract = { path = "crates/module/contract" }
kelson-module-sdk = { path = "crates/module/sdk" }
# --- internal (OBSERVABILITY) ---
kelson-observability = { version = "0.1.0", path = "crates/observability/logging" }
kelson-telemetry = { version = "0.1.0", path = "crates/observability/telemetry" }
kelson-tracing = { version = "0.1.0", path = "crates/observability/tracing" }
kelson-metrics = { version = "0.1.0", path = "crates/observability/metrics" }
kelson-audit = { version = "0.1.0", path = "crates/observability/audit" }
kelson-pipeline = { version = "0.1.0", path = "crates/observability/pipeline" }
kelson-buffer = { version = "0.1.0", path = "crates/observability/buffer" }
kelson-export = { version = "0.1.0", path = "crates/observability/export" }
# --- internal (TESTING) ---
kelson-testkit = { version = "0.1.0", path = "testing/testkit" }
# --- internal (TOOLS) ---
kelson-analyzer = { version = "0.1.0", path = "tools/kelson-analyzer" }
kelson-codegen = { version = "0.1.0", path = "tools/kelson-codegen" }
kelson-templates = { version = "0.1.0", path = "templates" }
# --- adapters (only runtime wires these) ---
kelson-cache-memory = { version = "0.1.0", path = "adapters/kelson-cache-memory" }
kelson-cache-redis = { version = "0.1.0", path = "adapters/kelson-cache-redis" }
kelson-ratelimit-redis = { version = "0.1.0", path = "adapters/kelson-ratelimit-redis" }
kelson-session-redis = { version = "0.1.0", path = "adapters/kelson-session-redis" }
kelson-session-postgres = { version = "0.1.0", path = "adapters/kelson-session-postgres" }
kelson-sms-msg91 = { version = "0.1.0", path = "adapters/kelson-sms-msg91" }
kelson-mail-smtp = { version = "0.1.0", path = "adapters/kelson-mail-smtp" }
kelson-storage-s3 = { version = "0.1.0", path = "adapters/kelson-storage-s3" }
kelson-storage-local = { version = "0.1.0", path = "adapters/kelson-storage-local" }
kelson-push-fcm = { version = "0.1.0", path = "adapters/kelson-push-fcm" }
kelson-webhooks = { version = "0.1.0", path = "adapters/kelson-webhooks" }
kelson-search-pgvector = { version = "0.1.0", path = "adapters/kelson-search-pgvector" }
# --- umbrella + reference application modules (merged from keel-kernel) ---
kelson-framework = { version = "0.1.0", path = "crates/framework" }
# Stage C.2: the module's host half (record, model, store, binding resolver,
# notifications, provider) is a contract the kernel links; the behaviour that
# consumes it ships as the `applications/*` guest artifact.
kelson-appointments-contract = { path = "crates/data/appointments" }
kelson-mod-appointments = { path = "applications/appointments" }
# Stage C.2: the module's host half (client record, client store, bundle
# carrier, provider) is a contract the kernel links; the RFC 6749 handlers
# that consume it ship as the `applications/*` guest artifact.
kelson-oauth2-contract = { path = "crates/data/oauth2" }
kelson-mod-oauth2 = { path = "applications/oauth2" }
# --- external (budget: policy v2 D-62, cap 26; see DEPENDENCY-POLICY.md) ---
axum = { version = "=0.8.6", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors", "catch-panic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "uuid", "time", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
moka = { version = "0.12", features = ["future", "sync"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
argon2 = "0.5"
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
regex = "1.10"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio-stream = { version = "0.1", features = ["sync"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
redis = { version = "0.27", default-features = false, features = ["script"] }
wasmtime = { version = "36", default-features = false, features = ["cranelift", "runtime", "wat", "std"] }

[profile.dev]
debug = 1