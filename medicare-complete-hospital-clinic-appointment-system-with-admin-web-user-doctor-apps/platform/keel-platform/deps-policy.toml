# Per-crate dependency policy (MVVC contract C16, gate E5).
#
# The allow-lists below are a reviewed freeze of the surface the live tree
# actually ships, not a target: any NEW external or platform dependency is a
# DEP-EXTERNAL-NOT-ALLOWED / DEP-CLASS-POSTURE refusal until this file is
# changed deliberately in the same review. Dev-dependencies are not listed;
# their direction stays under the class matrix (G07).
#
# Known target gaps are recorded here rather than hidden:
# - kelson-views -> kelson-http is V08/C16: the wire-plane trait must move
#   behind the `live-transport` feature (P3). Remove it from this list then.
# - kelson-demo and kelson-console carry the composition-root surface; their
#   lists shrink with P3/P4, never by accident.
#
# `external_cap` is DEPENDENCY-POLICY v2 (D-62), read by the analyzer instead
# of a literal in code (G-10).

[policy]
external_cap = 26


[allow."kelson-cache-memory"]
member = "adapters/kelson-cache-memory"
externals = ["moka"]
platform = ["kelson-caching"]

[allow."kelson-cache-redis"]
member = "adapters/kelson-cache-redis"
externals = ["redis", "serde_json", "time", "tracing", "uuid"]
platform = ["kelson-caching", "kelson-foundation", "kelson-jobs"]

