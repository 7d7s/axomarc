[package]
# Stage C module artifact (docs/18 Stage C.5): the workspace's first compiled
# application module. Everything around it already existed -- `WasmHost`
# compiles and drift-checks a guest, `packages.toml` already declares where an
# artifact and its reviewed sidecar live -- but no artifact shipped, so
# `load_wasm_plugins` returned `Ok(None)` on every boot and the wasm route was
# dormant. This crate closes that gap with the smallest thing that exercises
# the path end to end.
name = "kelson-module-marker"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
# A module ships as an artifact the host loads, not as a library other crates
# link. The host-target build is what `cargo clippy --workspace` lints; the
# artifact itself comes from:
#
#   cargo build --release --target wasm32-wasip1 -p kelson-module-marker
#
# Deliberately its own dependency closure (Stage C.3 hashes it and shows the
# kernel executable is not in it), which is why it has no dependencies at all.
crate-type = ["cdylib"]
