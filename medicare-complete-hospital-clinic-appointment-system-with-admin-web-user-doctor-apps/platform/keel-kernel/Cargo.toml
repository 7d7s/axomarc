[workspace]
resolver = "2"
members = [
  "kernel-api",
  "kernel-worker",
  "keel-kernel-facade",
  # Demo domain modules hard-wired into the kernel API host (the framework
  # ships them as its reference application; application code proper lives
  # in your-app/).
  "applications/appointments",
  "applications/oauth2",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/7d7s/axomarc"
readme = "README.md"
keywords = ["keel", "kernel"]

[workspace.dependencies]
# Framework dependencies (local path to keel-platform for dev; switch to registry for release)
keel-kernel = { version = "0.1", path = "keel-kernel-facade" }
# Demo domain modules shipped with the kernel host
keel-mod-appointments = { version = "0.1", path = "applications/appointments" }
keel-mod-oauth2 = { version = "0.1", path = "applications/oauth2" }
keel-config = { version = "0.1", path = "../keel-platform/crates/application/configuration" }
keel-execution = { version = "0.1", path = "../keel-platform/crates/execution/engine" }
keel-command = { version = "0.1", path = "../keel-platform/crates/execution/command" }
keel-query = { version = "0.1", path = "../keel-platform/crates/execution/query" }
keel-tenancy = { version = "0.1", path = "../keel-platform/crates/enterprise/tenancy" }
keel-registry = { version = "0.1", path = "../keel-platform/crates/application/registry" }
keel-http = { version = "0.1", path = "../keel-platform/crates/web/http" }
keel-views = { version = "0.1", path = "../keel-platform/crates/web/views" }
keel-validation = { version = "0.1", path = "../keel-platform/crates/foundation/validation" }
keel-jobs = { version = "0.1", path = "../keel-platform/crates/async/jobs" }
keel-event = { version = "0.1", path = "../keel-platform/crates/async/events" }
keel-wasm = { version = "0.1", path = "../keel-platform/crates/extension/wasm" }
keel-caching = { version = "0.1", path = "../keel-platform/crates/services/cache" }
keel-cache-memory = { version = "0.1", path = "../keel-platform/adapters/keel-cache-memory" }
keel-cache-redis = { version = "0.1", path = "../keel-platform/adapters/keel-cache-redis" }
keel-scheduling = { version = "0.1", path = "../keel-platform/crates/async/scheduler" }
keel-storage = { version = "0.1", path = "../keel-platform/crates/services/storage" }
keel-storage-local = { version = "0.1", path = "../keel-platform/adapters/keel-storage-local" }
keel-storage-s3 = { version = "0.1", path = "../keel-platform/adapters/keel-storage-s3" }
keel-notifications = { version = "0.1", path = "../keel-platform/crates/services/notifications" }
keel-search = { version = "0.1", path = "../keel-platform/crates/services/search" }
keel-realtime = { version = "0.1", path = "../keel-platform/crates/services/realtime" }
keel-deployment = { version = "0.1", path = "../keel-platform/crates/enterprise/deployment" }
keel-postgres = { version = "0.1", path = "../keel-platform/crates/data/postgres" }
keel-mysql = { version = "0.1", path = "../keel-platform/crates/data/mysql" }
keel-models = { version = "0.1", path = "../keel-platform/crates/data/models" }
keel-feature-flags = { version = "0.1", path = "../keel-platform/crates/enterprise/feature-flags" }
keel-session = { version = "0.1", path = "../keel-platform/crates/security/sessions" }
keel-identity = { version = "0.1", path = "../keel-platform/crates/security/identity" }
keel-policy = { version = "0.1", path = "../keel-platform/crates/security/policies" }
keel-scope = { version = "0.1", path = "../keel-platform/crates/security/scopes" }
keel-tokens = { version = "0.1", path = "../keel-platform/crates/security/tokens" }
keel-integrity = { version = "0.1", path = "../keel-platform/crates/security/integrity" }
keel-observability = { version = "0.1", path = "../keel-platform/crates/observability/logging" }
keel-metrics = { version = "0.1", path = "../keel-platform/crates/observability/metrics" }
keel-telemetry = { version = "0.1", path = "../keel-platform/crates/observability/telemetry" }
keel-foundation = { version = "0.1", path = "../keel-platform/crates/foundation/core" }
keel-context = { version = "0.1", path = "../keel-platform/crates/foundation/context" }
keel-lifecycle = { version = "0.1", path = "../keel-platform/crates/foundation/lifecycle" }
keel-mail-smtp = { version = "0.1", path = "../keel-platform/adapters/keel-mail-smtp" }

# External
axum = { version = "=0.8.6", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "mysql", "uuid", "time", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
toml = "0.8"
anyhow = "1"
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
tokio-stream = { version = "0.1", features = ["sync"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
redis = { version = "0.27", default-features = false, features = ["script"] }
wasmtime = { version = "36", default-features = false, features = ["cranelift", "runtime", "wat", "std"] }
argon2 = "0.5"
moka = { version = "0.12", features = ["future", "sync"] }

[profile.dev]
debug = 1