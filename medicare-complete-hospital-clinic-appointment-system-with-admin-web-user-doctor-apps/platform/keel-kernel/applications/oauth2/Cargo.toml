[package]
name = "keel-mod-oauth2"
# Internal-only crate: not published to crates.io.
publish = false
description = "OAuth2 authorization server: authorize, token, revoke, client registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true

[dependencies]
keel-foundation = { workspace = true }
keel-context = { workspace = true }
keel-execution = { workspace = true }
keel-identity = { workspace = true }
keel-lifecycle = { workspace = true }
keel-models = { workspace = true }
keel-tokens = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

[lib]
# Wave 8 P5 (B-21): every oauth2 test lives in an EXISTING suite (the
# keel-api http_integration suite drives the whole code flow over the real
# edge), so this crate opts out of its own test target — `cargo test
# --workspace` keeps its suite count unchanged.
test = false
doctest = false

[package.metadata.docs.rs]
all-features = true
