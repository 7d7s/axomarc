# module.toml — immutable contract shape (11-SPEC SS7). `kelson graph` compiles it.
[module]
name = "appointments"
version = "0.1.0"
maturity = "L0"
plane = "tenant"
description = "Kelson reference application: clinic appointments end-to-end"

[capabilities]
book = { profile = "COMMAND" }
list = { profile = "READ" }

[dependencies]
contracts = []

[[routes]]
method = "POST"
path = "/api/v1/appointments"
operation = "book"
capability = "book"

[[routes]]
method = "GET"
path = "/api/v1/appointments/{id}"
operation = "list"
capability = "list"

[[events]]
name = "appointment.booked"
