# module.toml — immutable contract shape (11-SPEC SS7). `kelson graph` compiles it.
# Starter (S9): full CRUD — one COMMAND for each write and one READ per read —
# over the framework ModelStore port.
[module]
name = "__PROJECT_NAME__"
version = "0.1.0"
api = 1
maturity = "L0"
plane = "tenant"
description = "__PROJECT_DESCRIPTION__"

[capabilities]
create = { profile = "COMMAND" }
list = { profile = "READ" }
read = { profile = "READ" }
update = { profile = "COMMAND" }
delete = { profile = "COMMAND" }

[dependencies]
contracts = []

[[routes]]
method = "POST"
path = "/api/v1/__PROJECT_NAME__/notes"
operation = "create"
capability = "create"
name = "notes.create"

[[routes]]
method = "GET"
path = "/api/v1/__PROJECT_NAME__/notes"
operation = "list"
capability = "list"
name = "notes.list"

[[routes]]
method = "GET"
path = "/api/v1/__PROJECT_NAME__/notes/{id}"
operation = "read"
capability = "read"
name = "notes.read"

[[routes]]
method = "PUT"
path = "/api/v1/__PROJECT_NAME__/notes/{id}"
operation = "update"
capability = "update"
name = "notes.update"

[[routes]]
method = "DELETE"
path = "/api/v1/__PROJECT_NAME__/notes/{id}"
operation = "delete"
capability = "delete"
name = "notes.delete"

[[events]]
name = "note.created"

[[events]]
name = "note.updated"

[[events]]
name = "note.deleted"
