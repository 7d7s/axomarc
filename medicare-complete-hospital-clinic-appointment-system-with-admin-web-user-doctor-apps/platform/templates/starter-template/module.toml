# module.toml — immutable contract shape (11-SPEC SS7). `keel graph` compiles it.
# Starter (S9): one COMMAND + one READ over the framework ModelStore port.
[module]
name = "__PROJECT_NAME__"
version = "0.1.0"
api = 1
maturity = "L0"
plane = "tenant"
description = "__PROJECT_DESCRIPTION__"

[capabilities]
create = { profile = "COMMAND" }
list = { profile = "READ" }

[dependencies]
contracts = []

[[routes]]
method = "POST"
path = "/api/v1/__PROJECT_NAME__/notes"
operation = "create"
capability = "create"
name = "notes.create"

[[routes]]
method = "GET"
path = "/api/v1/__PROJECT_NAME__/notes"
operation = "list"
capability = "list"
name = "notes.list"

[[events]]
name = "note.created"