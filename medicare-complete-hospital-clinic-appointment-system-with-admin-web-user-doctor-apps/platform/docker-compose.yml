services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel_dev_only
      POSTGRES_DB: keel
    ports: ["5432:5432"]
    volumes: [keel_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keel"]
      interval: 3s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: keel
      MINIO_ROOT_PASSWORD: keel_dev_only
    ports: ["9000:9000", "9001:9001"]
    volumes: [keel_minio:/data]

volumes:
  keel_pg: {}
  keel_minio: {}