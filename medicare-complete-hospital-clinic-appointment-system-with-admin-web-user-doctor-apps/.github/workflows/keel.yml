name: keel

on:
  push:
    paths: ["platform/**", ".github/workflows/keel.yml"]
    branches: [main]
  pull_request:
    paths: ["platform/**", ".github/workflows/keel.yml"]

defaults:
  run:
    working-directory: platform

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92.0
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/target
          key: keel-${{ hashFiles('platform/Cargo.lock') }}
          restore-keys: |
            keel-
      - name: cargo check
        run: cargo check --workspace --locked
      - name: cargo test (includes architecture gate)
        run: cargo test --workspace --locked
      - name: G18 telemetry resilience (failure injection + tenant isolation)
        run: |
          cargo test -p keel-observability --locked g18
          cargo test -p keel-api --test http_integration --locked telemetry_incident
      - name: architecture analyzer (xtask dep-rules)
        run: cargo run -p xtask -- dep-rules

      - name: publishability dry-run (main only)
        if: github.event_name == 'push'
        run: cargo run -p xtask -- publish --dry-run
