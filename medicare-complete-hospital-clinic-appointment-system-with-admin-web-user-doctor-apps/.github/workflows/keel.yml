name: kelson

on:
  push:
    paths: ["platform/**", ".github/workflows/keel.yml"]
    branches: [main]
  pull_request:
    paths: ["platform/**", ".github/workflows/keel.yml"]

# THREE independent Cargo workspaces -> three independent pipelines
# (CORRECTED-TARGET-ARCHITECTURE section 9, P1-4).
#
# Phase O (2026-10-10) merged the former `keel-kernel` workspace INTO
# `keel-platform` (`kernel-api` -> `runtime/kelson-demo`, `kernel-worker` ->
# `runtime/kelson-worker`, facade -> `crates/framework`), so its dedicated job and
# its `keel-publish.yml` MSRV leg were removed with it: `platform/keel-kernel`
# no longer exists and a job pointing at it could never pass.
#
# `platform/Cargo.toml` is a workspace root whose `members` do NOT include
# keel-platform or your-app - each of those is its own workspace
# root with its own Cargo.lock. A single `working-directory: platform` job
# therefore covered only the original tree and missed all two new ones.
#
# Each job pins its own working-directory and its own target cache, so a red
# build names the workspace that broke. `defaults` is deliberately per-job rather
# than workflow-level: a workflow-level default would silently run your-app
# commands against the platform tree.
#
# Cache keys are per-workspace and hash that workspace's OWN Cargo.lock, because
# the three resolve independently.
#
# `platform` (the original tree) is kept as its own job: it still owns the
# xtask dep-rules architecture gate and the publishability dry-run, and it is
# not superseded by keel-platform - they are separate workspaces.

jobs:
  platform:
    name: platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92.0
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/target
          key: keel-platform-orig-${{ hashFiles('platform/Cargo.lock') }}
          restore-keys: |
            keel-platform-orig-
          # Deliberately NOT a bare `keel-` fallback: that prefix still matches every
          # `keel-platform-*` key in these workflows (`keel-platform-orig-` above,
          # `keel-platform-new-`, `keel-platform-mysql-`), so a lockfile change would
          # restore another workspace's archive -- a target/ built for a different tree
          # and toolchain, i.e. a cold build with an extra wasted download.
      - name: cargo check
        run: cargo check --workspace --locked
      - name: cargo clippy (default)
        run: cargo clippy --workspace --locked -- -D warnings
      - name: cargo test (includes architecture gate)
        run: cargo test --workspace --locked
      # The dependency gate. `cargo deny` is the POLICY (the advisories, the
      # bans, the licences, the sources) and it is BLOCKING: a wildcard
      # dependency or a copyleft licence fails the build. `cargo audit` is
      # the advisory scan. Neither had a step, so the gate existed only as
      # a document.
      - name: the dependency gate (cargo-deny: the advisories, the bans, the licences, the sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          argument: --manifest-path keel-platform/Cargo.toml
      - name: install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      # RUSTSEC-2023-0071 (the rsa "Marvin Attack") is the ONE accepted
      # advisory: there is no upstream fix (patched = []), it arrives only
      # transitively through sqlx-mysql, and the database connection must be
      # TLS or local. The same justification is recorded in platform/deny.toml.
      - name: the dependency audit (the RustSec advisories)
        run: cargo audit --ignore RUSTSEC-2023-0071
      # The supply-chain artefacts: the SBOM (CycloneDX, every locked crate
      # with its checksum) and the build provenance (the git material and
      # the digests of the release artifacts).
      - name: the SBOM and the build provenance
        shell: pwsh
        run: |
          ./keel-platform/tools/generate-sbom.ps1 -Output "${{ github.workspace }}/platform/keel-platform/sbom.cdx.json"
          ./keel-platform/tools/generate-provenance.ps1 -Output "${{ github.workspace }}/platform/keel-platform/provenance.json"
      - name: upload the supply-chain artefacts
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain
          path: |
            keel-platform/sbom.cdx.json
            keel-platform/provenance.json
      - name: G18 telemetry resilience (failure injection + tenant isolation)
        run: |
          cargo test -p kelson-observability --locked g18
          cargo test -p kelson-demo --test http_integration --locked telemetry_incident
      - name: architecture analyzer (xtask dep-rules)
        run: cargo run -p xtask -- dep-rules
      # The semver gate exists and runs, but no CI job called it. It is a
      # documented no-op until the repository has a release baseline; the
      # install is in the step because the xtask probes for the subcommand
      # and skips when it is absent.
      - name: semver gate (breaking-change check)
        run: |
          cargo install cargo-semver-checks --locked
          cargo run -p xtask -- semver
      - name: publishability dry-run (main only)
        if: github.event_name == 'push'
        run: cargo run -p xtask -- publish --dry-run

  keel-platform:
    name: keel-platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/keel-platform
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92.0
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      # A full disk fails the build as a LINKER error (LNK1318 - a PDB write
      # that cannot land), which points at the toolchain instead of at the
      # disk. Fail early with the real cause.
      - name: free disk check (a full disk breaks the build as a linker error)
        run: |
          avail=$(df -BG --output=avail "$PWD" | tail -1 | tr -dc '0-9')
          if [ "${avail:-0}" -lt 10 ]; then
            echo "::error::only ${avail}G free on the runner - a full disk fails the build as a linker error"
            exit 1
          fi
          echo "disk free: ${avail}G"
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/keel-platform/target
          key: keel-platform-new-${{ hashFiles('platform/keel-platform/Cargo.lock') }}
          restore-keys: |
            keel-platform-new-
      - name: cargo check
        run: cargo check --workspace --locked
      - name: cargo clippy (default)
        run: cargo clippy --workspace --locked -- -D warnings
      - name: cargo clippy (component-model)
        run: cargo clippy --workspace --locked --features component-model -- -D warnings
      - name: cargo clippy (all-features)
        run: cargo clippy --workspace --locked --all-features -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
      - name: coverage (llvm-cov)
        # The tool is a CI dependency, not an optional extra: if the install
        # or the run fails, the job fails. A step that cannot fail proves
        # nothing - LF-094's "coverage smoke" only means something when the
        # step can go red. The numeric threshold is a separate, open item.
        run: |
          cargo install cargo-llvm-cov --locked
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
      - name: architecture analyzer (xtask dep-rules)
        run: cargo run -p xtask -- dep-rules

  # A generated module must COMPILE. `kelson make:module` writes a module
  # into `applications/<name>`, adds the workspace member and prints
  # `cargo check` as the next step - but the generated crate was not built by
  # CI, so a broken template shipped silently (it did: the template's
  # `authorize` carried a stale signature and every scaffolded module failed
  # to compile). A throwaway checkout needs no cleanup.
  scaffold-build:
    name: scaffold build (a generated module must compile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/keel-platform
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92.0
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/keel-platform/target
          key: keel-scaffold-${{ hashFiles('platform/keel-platform/Cargo.lock') }}
          restore-keys: |
            keel-scaffold-
      - name: scaffold a module and build it
        run: |
          cargo run -p kelson-console -- make:module ci-probe --description "CI scaffold probe"
          cargo check -p kelson-mod-ci-probe --all-targets
          cargo test -p kelson-mod-ci-probe --locked

  your-app:
    name: your-app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/your-app
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92.0
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/your-app/target
          key: kelson-app-${{ hashFiles('platform/your-app/Cargo.lock') }}
          restore-keys: |
            kelson-app-
      - name: cargo check
        run: cargo check --workspace --locked
      - name: cargo test
        run: cargo test --workspace --locked

  # Wave 9 B-31 / Phase B: the live-MySQL driver matrix.
  #
  # Every test in pg_integration.rs is DATABASE_URL-gated and scheme-selected,
  # so with `mysql://` the pg_* half self-skips (its create_pool refuses that
  # scheme) and the mysql_* half runs against a real MySQL 8 with migrations
  # applied by the test itself. Without a service container this suite is an
  # all-skip green -- which is exactly how the MySQL-specific defects it now
  # catches stayed invisible (a `unique` probe that never fired, a savepoint
  # scope that could not be written, and a claim path that starved a second
  # worker while work was pending). The container is the point of this job.
  platform-mysql:
    name: platform (mysql matrix)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: keel
          MYSQL_USER: keel
          MYSQL_PASSWORD: keel
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: mysql://keel:keel@127.0.0.1:3306/keel
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.92.0
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            platform/target
          key: keel-platform-mysql-${{ hashFiles('platform/Cargo.lock') }}
          restore-keys: |
            keel-platform-mysql-
            keel-platform-orig-
      - name: mysql driver matrix (pg half self-skips on mysql://)
        run: cargo test -p kelson-postgres --features pg-tests --test pg_integration --locked
      # The shared modelstore conformance target (the contract the in-memory
      # fake, pg and mysql all run) was NOT in CI - which is how the suite
      # could sit red against the live schema for a whole session without
      # CI noticing.
      - name: shared modelstore conformance (the contract every backend runs)
        run: cargo test -p kelson-postgres --features pg-tests --test modelstore_conformance --locked
      # The MySQL 8 native capability matrix: CTEs, the recursive CTE, the
      # window functions and the NOWAIT / SKIP LOCKED lock modes, executed
      # against the live MySQL 8 service. These are the features Laravel's
      # query builder has no API for - without a service container they
      # would skip, and a skip is not a proof.
      - name: mysql native capability matrix (CTEs, window functions, lock modes)
        run: cargo test -p kelson-postgres --features pg-tests --test mysql_native --locked
      # The migration-safety matrix: the guarded runner (every statement is
      # recorded, so a failed run RESUMES instead of re-applying the whole
      # file) and the online change (shadow table + copy + an atomic swap).
      # A migration that dies half-way is the classic production incident.
      - name: mysql migration safety (the guarded runner + the online change)
        run: cargo test -p kelson-postgres --features pg-tests --test mysql_migrations --locked
      # The cost axis: a write that would touch more rows than the tenant's
      # ceiling is refused BEFORE it runs, and every statement's cost is
      # recorded per tenant. The cheapest enterprise-scale failure is one
      # tenant's runaway batch write, not a crash.
      - name: mysql cost axis (the budget refuses a runaway write)
        run: cargo test -p kelson-postgres --features pg-tests --test mysql_cost --locked
      # The upgrade contract: the schema has a version (a digest over the
      # applied set), a stale schema is REFUSED rather than served against,
      # and a change to an existing table goes through the online path.
      - name: mysql upgrade contract (the schema version, the refusal, the online change)
        run: cargo test -p kelson-postgres --features pg-tests --test mysql_upgrade --locked
      # The claim race only reproduces when two workers overlap, so one green
      # run would not be evidence. Repeat it: a regression here means a worker
      # fleet idles while jobs are queued.
      - name: queue claim concurrency (5 repeats, starvation regression)
        run: |
          for i in 1 2 3 4 5; do
            cargo test -p kelson-postgres --features pg-tests --test pg_integration --locked mysql_job_store_claim
          done
